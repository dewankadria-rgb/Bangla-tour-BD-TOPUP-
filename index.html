<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ওয়েবসাইট সাময়িকভাবে বন্ধ আছে</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts (Hind Siliguri for Bengali typography) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Hind Siliguri', sans-serif;
            background-color: #0f172a;
            overflow-x: hidden;
        }

        /* Ambient glowing background blobs animation */
        .glow-blob {
            position: absolute;
            filter: blur(90px);
            opacity: 0.5;
            border-radius: 50%;
            animation: pulse-glow 8s infinite alternate ease-in-out;
        }

        .glow-1 {
            top: -10%;
            left: -10%;
            width: 400px;
            height: 400px;
            background: linear-gradient(135deg, #6366f1, #a855f7);
        }

        .glow-2 {
            bottom: -10%;
            right: -10%;
            width: 450px;
            height: 450px;
            background: linear-gradient(135deg, #ec4899, #3b82f6);
            animation-delay: -4s;
        }

        @keyframes pulse-glow {
            0% { transform: scale(1) translate(0, 0); opacity: 0.4; }
            100% { transform: scale(1.2) translate(30px, -30px); opacity: 0.7; }
        }

        /* Glassmorphism Card Style */
        .glass-card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        /* Pulse Status Light Animation */
        .status-pulse {
            position: relative;
        }

        .status-pulse::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background-color: #f59e0b;
            animation: ping 2s cubic-bezier(0, 0, 0.2, 1) infinite;
        }

        @keyframes ping {
            75%, 100% {
                transform: translate(-50%, -50%) scale(2.2);
                opacity: 0;
            }
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 relative text-slate-100 selection:bg-purple-500 selection:text-white">

    <div class="glow-blob glow-1"></div>
    <div class="glow-blob glow-2"></div>

    <!-- Main Container Card -->
    <main class="w-full max-w-3xl glass-card rounded-3xl p-6 sm:p-10 md:p-12 relative z-10 my-8 border border-slate-700/50">
        
        <div class="flex flex-col items-center text-center">
            
          

            <!-- Maintenance Decorative Icon -->
            <div class="w-20 h-20 sm:w-24 sm:h-24 rounded-2xl bg-gradient-to-tr from-indigo-500 via-purple-500 to-pink-500 flex items-center justify-center shadow-lg shadow-indigo-500/30 mb-8 transform hover:rotate-6 transition-transform duration-300">
                <i class="fa-solid fa-screwdriver-wrench text-3xl sm:text-4xl text-white"></i>
            </div>

            <h1 class="text-2xl sm:text-4xl font-bold tracking-tight text-white mb-4 leading-tight">
                এই ওয়েবসাইটটি ইতিমধ্যে বন্ধ, <br class="hidden sm:block">
                <span class="bg-gradient-to-r from-indigo-400 via-purple-400 to-pink-400 bg-clip-text text-transparent">
                    কিছুদিনের মধ্যে ওয়েবসাইটটি পুনরায় চালু হবে।
                </span>
            </h1>

           

         

            <!-- Social Links & Footer -->
            <div class="mt-10 pt-6 border-t border-slate-800/80 w-full flex flex-col sm:flex-row items-center justify-between gap-4 text-slate-400 text-sm">
                <p>© ২০২৬ সর্বস্বত্ব সংরক্ষিত।</p>
              
    </main>

</body>
</html>
